name: Create release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag'
        required: true
  push:
    paths-ignore:
      - '**/**.md'
      - '.github/**'
    branches:
      - main

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Dogfood the action from this commit so every release is created by the code being released
      - name: Create release
        uses: ./
        with:
          use-sem-ver: true
          tag: ${{ inputs.tag }}
